name: Portable NeLisp IME

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/nelisp-ime/**'
      # The lattice engine is a submodule, so a change to it reaches this
      # repository as a pointer update under this path and nothing else.
      # Without the line, changing the conversion engine -- the thing the
      # smokes exist to test -- ran no job at all.
      - 'packages/nelisp-ime-lattice'
      - 'packages/nelisp-json/**'
      - 'platform/**'
      - '.github/workflows/ime.yml'
  pull_request:
    paths:
      - 'packages/nelisp-ime/**'
      # The lattice engine is a submodule, so a change to it reaches this
      # repository as a pointer update under this path and nothing else.
      # Without the line, changing the conversion engine -- the thing the
      # smokes exist to test -- ran no job at all.
      - 'packages/nelisp-ime-lattice'
      - 'packages/nelisp-json/**'
      - 'platform/**'
      - '.github/workflows/ime.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'
      - run: make test-one FILE="packages/nelisp-ime/test/nelisp-ime-test.el packages/nelisp-ime/test/nelisp-ime-protocol-test.el packages/nelisp-ime/test/nelisp-ime-stateline-test.el"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'
      - name: Install adapter SDKs
        run: sudo apt-get update && sudo apt-get install -y g++ cmake libfcitx5core-dev libibus-1.0-dev libxml2-utils
      - name: Build Fcitx 5 addon
        run: |
          make standalone-reader
          cmake -S platform/linux -B platform/linux/build -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build platform/linux/build --parallel 2
          DESTDIR="$RUNNER_TEMP/nelisp-ime-stage" cmake --install platform/linux/build
      - name: Check IBus bridge
        run: make -C platform/linux/ibus check
      - name: Build Linux NeLisp and run protocol integration
        run: make -C platform/common smoke

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'
      - run: make standalone-reader NELISP_STANDALONE_TARGET=macos-aarch64
      - run: make -C platform/macos smoke
      - run: make -C platform/common smoke

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: jcs090218/setup-emacs-windows@master
        with:
          version: '30.1'
      - name: Build Windows NeLisp
        shell: bash
        # Pass the target as a make variable, not an environment prefix: the
        # runner's Git Bash hands MSYS2 make an environment without it, and the
        # Makefile then builds the linux-x86_64 default.  Upstream CI passes it
        # the same way.
        run: make standalone-reader NELISP_STANDALONE_TARGET=windows-x86_64
      - name: Build common client and run its smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S platform/common -B platform/common/build-cmake -A x64
          cmake --build platform/common/build-cmake --config Release
          platform/common/build-cmake/Release/nelisp-ime-common-smoke.exe target/nelisp.exe $PWD platform/common/build-cmake/learning.json